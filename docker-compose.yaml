# Runflow: Postgres, Valkey (D-047), Garage + the API, for local testing (root.md §7.6; QA has its own in ops/qa).
#   cp .env.example .env        # then fill it in (docker compose reads .env from this folder)
#   docker compose up -d --build
#   docker compose run --rm api doctor           # what's configured, what's missing
#   docker compose run --rm api email-test --to voce@email.com
#   curl localhost:3000/v1/health
# The web app keeps running with `npm run dev` on :8080 (against the mock until the backend
# implements the whole contract; see docs/build-plan.md Phase 2).

name: runflow

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-runflow}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage (D-037): logos, avatars, activity files. One node; it creates the bucket and
  # the API's key on first start (ops/garage/garage.toml).
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env (openssl rand -hex 32)}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-runflow}
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env (GK + openssl rand -hex 16)}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env (openssl rand -hex 32)}
    volumes:
      - ./ops/garage/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    ports:
      - "127.0.0.1:${GARAGE_HOST_PORT:-3900}:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Valkey (D-047; Redis protocol): sign-in codes, rate-limit counters, the session and read caches. Postgres is the
  # record, so nothing is persisted here; every key has a TTL. Host port 6380 so a local Redis/Valkey on 6379 can stay.
  # Production (P1): ElastiCache for Valkey.
  valkey:
    image: valkey/valkey:8.1.11-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
      args:
        RUNFLOW_GIT_SHA: ${RUNFLOW_GIT_SHA:-}
    image: ghcr.io/otaviojacobi/runflow:${RUNFLOW_TAG:-local}
    restart: unless-stopped
    # migrate, then serve
    command: ["all"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-runflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-runflow}
      REDIS_URL: redis://valkey:6379
      HOST: 0.0.0.0
      PORT: "3000"
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-runflow}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/runflow", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  garage:

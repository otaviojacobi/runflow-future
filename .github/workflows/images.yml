name: images

# Builds the QA images for the Raspberry Pi (arm64) on every push to main and pushes them to GHCR:
#   ghcr.io/otaviojacobi/runflow-api:qa, :sha-<commit>   (backend/Dockerfile)
#   ghcr.io/otaviojacobi/runflow-web:qa, :sha-<commit>   (frontend/Dockerfile, context = repo root)
# The Pi pulls :qa every 5 minutes (ops/qa/update.sh). Pin a commit with RUNFLOW_TAG=sha-<commit> in ops/qa/.env.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }} (arm64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: runflow-api
            context: backend
            file: backend/Dockerfile
          - image: runflow-web
            context: .
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          build-args: RUNFLOW_GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/otaviojacobi/${{ matrix.image }}:qa
            ghcr.io/otaviojacobi/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

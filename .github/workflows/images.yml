name: images

# Builds the QA images on every push to main and pushes them to GHCR for amd64 (the Intel NUC that hosts QA, D-046;
# the Raspberry Pi is retired):
#   ghcr.io/otaviojacobi/runflow-api:qa, :sha-<commit>, :v<version>   (backend/Dockerfile)
#   ghcr.io/otaviojacobi/runflow-web:qa, :sha-<commit>, :v<version>   (frontend/Dockerfile, context = repo root)
# Every push to main is a release (D-048): the version comes from the conventional commits since the last `v*` tag
# (.github/scripts/next-version.sh), is baked into the API (`/v1/health` → "0.2.0+<sha>"), and once the images are
# published the commit is tagged `v<version>` with a GitHub release.
# The build job pushes by digest and the publish job tags it, so adding an architecture back is one matrix entry
# (arm64 builds natively on ubuntu-24.04-arm). The QA host pulls :qa every 5 minutes (ops/qa/update.sh). Pin a commit
# with RUNFLOW_TAG=sha-<commit> in ops/qa/.env.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Next version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: echo "version=$(bash .github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - run: echo "Releasing v${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [runflow-api, runflow-web]
        arch: [amd64]
        include:
          - image: runflow-api
            context: backend
            file: backend/Dockerfile
          - image: runflow-web
            context: .
            file: frontend/Dockerfile
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only; the merge job below tags the multi-arch image.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            RUNFLOW_GIT_SHA=${{ github.sha }}
            RUNFLOW_VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=ghcr.io/otaviojacobi/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: ${{ matrix.image }} (tags)
    needs: [version, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [runflow-api, runflow-web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag :qa, :sha-<commit> and :v<version>
        working-directory: /tmp/digests
        run: |
          repo="ghcr.io/otaviojacobi/${{ matrix.image }}"
          docker buildx imagetools create \
            -t "$repo:qa" -t "$repo:sha-${GITHUB_SHA::7}" -t "$repo:v${{ needs.version.outputs.version }}" \
            $(printf "$repo@sha256:%s " *)
          docker buildx imagetools inspect "$repo:qa"

  release:
    name: Tag v${{ needs.version.outputs.version }}
    needs: [version, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and GitHub release (notes from the commits since the last tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION already exists"; exit 0
          fi
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
          gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"

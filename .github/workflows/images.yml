name: images

# Builds the QA images on every push to main and pushes them to GHCR for amd64 (the Intel NUC that hosts QA, D-046;
# the Raspberry Pi is retired):
#   ghcr.io/otaviojacobi/runflow-api:qa, :sha-<commit>   (backend/Dockerfile)
#   ghcr.io/otaviojacobi/runflow-web:qa, :sha-<commit>   (frontend/Dockerfile, context = repo root)
# The build job pushes by digest and the publish job tags it, so adding an architecture back is one matrix entry
# (arm64 builds natively on ubuntu-24.04-arm). The QA host pulls :qa every 5 minutes (ops/qa/update.sh). Pin a commit
# with RUNFLOW_TAG=sha-<commit> in ops/qa/.env.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [runflow-api, runflow-web]
        arch: [amd64]
        include:
          - image: runflow-api
            context: backend
            file: backend/Dockerfile
          - image: runflow-web
            context: .
            file: frontend/Dockerfile
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only; the merge job below tags the multi-arch image.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: RUNFLOW_GIT_SHA=${{ github.sha }}
          outputs: type=image,name=ghcr.io/otaviojacobi/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: ${{ matrix.image }} (tags)
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [runflow-api, runflow-web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag :qa and :sha-<commit>
        working-directory: /tmp/digests
        run: |
          repo="ghcr.io/otaviojacobi/${{ matrix.image }}"
          docker buildx imagetools create \
            -t "$repo:qa" -t "$repo:sha-${GITHUB_SHA::7}" \
            $(printf "$repo@sha256:%s " *)
          docker buildx imagetools inspect "$repo:qa"

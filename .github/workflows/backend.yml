name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "api/schema.sql", "design/dist/**", "docker-compose.yaml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "api/schema.sql", "design/dist/**", "docker-compose.yaml", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: rustfmt, clippy, tests on Postgres 18 and Redis 8
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: runflow
          POSTGRES_PASSWORD: runflow
          POSTGRES_DB: runflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Ephemeral and cache data (D-047); tests use random key prefixes.
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://runflow:runflow@localhost:5432/runflow
      TEST_REDIS_URL: redis://localhost:6379
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: bash backend/scripts/check.sh

  image:
    name: Docker image builds (amd64; multi-arch publish comes with ops, S8)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: false
          build-args: RUNFLOW_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

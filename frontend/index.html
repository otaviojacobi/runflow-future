<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F9FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0C11" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Runflow</title>
    <!-- §7.8: apply the cached club theme and color mode BEFORE first paint (no flash of Runflow colors). -->
    <script>
      try {
        var css = localStorage.getItem("rf.theme");
        if (css) { var s = document.createElement("style"); s.id = "club-theme"; s.textContent = css; document.head.appendChild(s); }
        var mode = localStorage.getItem("rf.mode");
        if (mode === "dark" || mode === "light") document.documentElement.setAttribute("data-theme", mode);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Runflow QA (Intel NUC, D-046): everything behind one Cloudflare Tunnel; only the database viewer (pgweb, :8091) is on the LAN.
#   qa.runflow.club → web (static app + /api proxy) → api (+ worker) → postgres, valkey
#   grafana-qa.runflow.club → grafana (logs in Loki, metrics in Prometheus, both collected by Alloy; D-041)
# Images are built for arm64 by GitHub Actions (.github/workflows/images.yml) and pulled from GHCR.
# Setup: docs/ops/qa-pi.md (open items: setup-todo.md). Settings: ops/qa/.env (from ops/qa/.env.example).

name: runflow-qa

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ops/qa/.env}
      POSTGRES_DB: ${POSTGRES_DB:-runflow}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30

  # Valkey (D-047; Redis protocol): sign-in codes, rate-limit counters, the session and read caches. Nothing to keep
  # (Postgres is the record), so no persistence at all; every key has a TTL, so under memory pressure the least
  # recently used go first. Only the API reaches it (compose network, no port, no password).
  valkey:
    image: valkey/valkey:8.1.11-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 192m

  # S3-compatible object storage (D-037): logos, avatars, activity files. One node; it creates the bucket and
  # the API's key on first start (ops/garage/garage.toml).
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in ops/qa/.env (openssl rand -hex 32)}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-runflow}
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in ops/qa/.env (GK + openssl rand -hex 16)}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in ops/qa/.env (openssl rand -hex 32)}
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: ghcr.io/otaviojacobi/runflow-api:${RUNFLOW_TAG:-qa}
    restart: unless-stopped
    # migrate, then serve the API and run the background worker (e-mails, Strava)
    command: ["all"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-runflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-runflow}
      REDIS_URL: redis://valkey:6379
      HOST: 0.0.0.0
      PORT: "3000"
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-runflow}
      DEPLOYMENT_ENV: qa
      # Metrics to Alloy (→ Prometheus); Alloy reads the logs from Docker itself, and QA keeps no traces (D-041).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_TRACES_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_METRIC_EXPORT_INTERVAL: "30000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/runflow", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ghcr.io/otaviojacobi/runflow-web:${RUNFLOW_TAG:-qa}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in ops/qa/.env (Cloudflare Zero Trust → Tunnels)}
    depends_on:
      - web

  # ---------------------------------------------------------------- database viewer: pgweb, read-only, on the LAN
  # only (not in the tunnel): http://runflow-qa.local:8091 (or the NUC's IP), user `runflow`, PGWEB_PASSWORD in .env.
  pgweb:
    image: sosedoff/pgweb:0.17.0
    restart: unless-stopped
    command: ["--readonly", "--skip-open", "--lock-session", "--no-idle-timeout"]
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-runflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-runflow}?sslmode=disable
      PGWEB_AUTH_USER: runflow
      PGWEB_AUTH_PASS: ${PGWEB_PASSWORD:?set PGWEB_PASSWORD in ops/qa/.env}
    ports:
      - "8091:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------- observability (D-041): QA only; production
  # sends to Grafana Cloud (D-040). Configs in ops/qa/observability/.
  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    mem_limit: 768m

  # Collects every container's logs (Docker socket, read-only), the API's OTLP metrics and the Pi's host metrics.
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /run/udev:/run/udev:ro
    depends_on: [loki, prometheus]
    mem_limit: 512m

  # https://grafana-qa.runflow.club (a tunnel route to http://grafana:3000). Sign in with GRAFANA_ADMIN_USER /
  # GRAFANA_ADMIN_PASSWORD from .env; the "Runflow QA" dashboard and both data sources are provisioned.
  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in ops/qa/.env (openssl rand -hex 16)}
      GF_SERVER_ROOT_URL: https://grafana-qa.runflow.club
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Internal tool: English, whatever the browser's language (only customer-facing text is pt-BR, D-013).
      GF_USERS_DEFAULT_LANGUAGE: en-US
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/runflow-qa.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on: [loki, prometheus]
    mem_limit: 512m

volumes:
  pgdata:
  garage:
  loki:
  prometheus:
  alloy:
  grafana:

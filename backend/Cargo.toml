[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
runflow-api = { path = "crates/api" }
runflow-db = { path = "crates/db" }
runflow-domain = { path = "crates/domain" }
runflow-integrations = { path = "crates/integrations" }
runflow-jobs = { path = "crates/jobs" }

anyhow = "1"
aws-lc-rs = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["form"] }
chrono-tz = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
http-body-util = "0.1"
object_store = { version = "0.14", features = ["aws"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "json", "uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "request-id", "timeout", "catch-panic", "compression-gzip", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Faster debug builds of the heavy dependencies; our code stays debuggable.
[profile.dev.package."*"]
opt-level = 1
